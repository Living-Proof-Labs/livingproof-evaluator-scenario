[project]
name = "livingproof-evaluator-scenario"
dynamic = ["version"]
description = "Deterministic scenario evaluator for Living Proof Labs robot capability verification."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "livingproof-scenario-parameters @ git+https://github.com/Living-Proof-Labs/robot-capability-specs@v2.2.0#subdirectory=python",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.2",
]

[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

# No release tag yet: hatch-vcs reports a dev version such as 0.1.devN.
# After semantic-release tags v1.0.0, the same commit's package version is 1.0.0.
# local versions are omitted so the string is the tag, not a +g commit suffix.
[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
fallback_version = "0.1.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/livingproof_evaluator_scenario"]

# The frozen parameter file is data, not a Python module. Editable installs read it
# beside the source; a wheel must carry the same file.
[tool.hatch.build.targets.wheel.force-include]
"src/livingproof_evaluator_scenario/compat/parameters.json" = "livingproof_evaluator_scenario/compat/parameters.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
