[project]
name = "livingproof-evaluator-scenario"
version = "0.0.0"
description = "Deterministic scenario evaluator for Living Proof Labs robot capability verification."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livingproof_evaluator_scenario"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
