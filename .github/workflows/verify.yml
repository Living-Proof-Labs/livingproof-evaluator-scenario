# SPDX-License-Identifier: Apache-2.0
# This repository has no published development image. Until one exists, these
# jobs are the documented fallback: GitHub-hosted ubuntu-24.04 and
# ubuntu-24.04-arm, the pinned uv setup action, and Task 3.54.0, running the
# same `task setup` and `task verify` commands as a local checkout. Publishing
# the image needs owner approval and a registry permission this repository
# does not add, so this change does not open a tracking issue.
name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published stable release tag (vX.Y.Z) at current main to replay
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            actionlint_archive: actionlint_1.7.12_linux_amd64.tar.gz
            actionlint_sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          - architecture: arm64
            runner: ubuntu-24.04-arm
            actionlint_archive: actionlint_1.7.12_linux_arm64.tar.gz
            actionlint_sha256: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history and tags, so hatch-vcs can read the release tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: "3.54.0"
      - run: task setup
      - run: task verify
        env:
          # Opt in to the network-gated tests (the guidelines interface, the docs brand lock and
          # the fixture lock hash), so drift fails the job that bumped it (#46).
          LIVINGPROOF_NETWORK: "1"
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish test results
        id: report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Scenario evaluator tests (${{ matrix.architecture }})
          path: artifacts/tests.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true
      - name: Retain the JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-report-${{ matrix.architecture }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/tests.xml
          retention-days: 30
          if-no-files-found: error
      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Scenario evaluator tests (${{ matrix.architecture }})"
            echo "Passed: ${{ steps.report.outputs.passed }}"
            echo "Failed: ${{ steps.report.outputs.failed }}"
            echo "Skipped: ${{ steps.report.outputs.skipped }}"
            echo "Check: ${{ steps.report.outputs.url }}"
            echo "Raw JUnit report retained for 30 days as artifact junit-report-${{ matrix.architecture }}-${{ github.event.pull_request.head.sha || github.sha }}."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: actionlint
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_ARCHIVE: ${{ matrix.actionlint_archive }}
          ACTIONLINT_SHA256: ${{ matrix.actionlint_sha256 }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$ACTIONLINT_ARCHIVE"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$ACTIONLINT_ARCHIVE" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
  version:
    permissions:
      contents: read
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release-candidate.yml@v9.9.2
    with:
      replay-tag: ${{ inputs.release_tag || '' }}
  manual:
    needs: version
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.ref == 'refs/heads/main' &&
       (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    permissions:
      contents: read
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ needs.version.outputs.semver-version }}
      commit: ${{ needs.version.outputs.commit }}
      plan-run: ${{ needs.version.outputs.run-id }}
      plan-attempt: ${{ needs.version.outputs.run-attempt }}
  release:
    needs: [verify, version, manual]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.version.outputs.version != '' &&
      needs.version.outputs.git-tag == format('v{0}', needs.manual.outputs.artifact-version) &&
      needs.version.outputs.version == needs.manual.outputs.artifact-version &&
      needs.version.outputs.commit == github.sha &&
      needs.manual.outputs.artifact-commit == github.sha &&
      needs.manual.outputs.artifact-run-id == github.run_id &&
      needs.manual.outputs.artifact-attempt == github.run_attempt &&
      needs.manual.outputs.artifact-digest != '' &&
      needs.manual.outputs.artifact-id != ''
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v9.9.2
    with:
      expected-version: ${{ needs.manual.outputs.artifact-version }}
      expected-commit: ${{ needs.manual.outputs.artifact-commit }}
  deploy:
    needs: [version, manual, release]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.version.result == 'success' && needs.manual.result == 'success' &&
      needs.manual.outputs.artifact-commit == github.sha &&
      needs.manual.outputs.artifact-run-id == github.run_id &&
      needs.manual.outputs.artifact-attempt == github.run_attempt &&
      needs.manual.outputs.artifact-digest != '' &&
      needs.manual.outputs.artifact-id != '' &&
      ((github.event_name == 'push' && needs.release.result == 'success' &&
        needs.release.outputs.published == 'true' &&
        needs.release.outputs.version == needs.manual.outputs.artifact-version &&
        needs.release.outputs.commit == needs.manual.outputs.artifact-commit) ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' &&
        needs.release.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: docs-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CANDIDATE: ${{ needs.manual.outputs.artifact-commit }}
      VERSION: ${{ needs.manual.outputs.artifact-version }}
      DIGEST: ${{ needs.manual.outputs.artifact-digest }}
      RELEASE_TAG: ${{ needs.release.outputs.git-tag || inputs.release_tag }}
    steps:
      - name: Independently require the published stable release at the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$VERSION"
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE" = "$GITHUB_SHA"
          export GIT_TERMINAL_PROMPT=0
          ref="refs/tags/$RELEASE_TAG"
          tags=$(timeout 30s git -c credential.helper= ls-remote --exit-code \
            "https://github.com/$GITHUB_REPOSITORY.git" "$ref" "$ref^{}")
          mapfile -t refs <<< "$tags"
          if [[ ${#refs[@]} == 2 ]]; then
            [[ "${refs[0]%$'\t'*}" =~ ^[0-9a-f]{40}$ ]]
            test "${refs[0]#*$'\t'}" = "$ref"
            test "${refs[1]}" = "$CANDIDATE"$'\t'"$ref^{}"
          else
            test "${#refs[@]}" = 1
            test "${refs[0]}" = "$CANDIDATE"$'\t'"$ref"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" | \
            jq -e --arg tag "$RELEASE_TAG" '
              .tag_name == $tag and .draft == false and .prerelease == false and
              (.published_at | type == "string" and length > 0)
            ' >/dev/null
      - name: Require the single immutable artifact ID
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.manual.outputs.artifact-id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.manual.outputs.artifact-id }}
          merge-multiple: true
          path: verified-manual
      - name: Verify transport and package only the sealed HTML
        shell: bash
        run: |
          set -euo pipefail
          cd verified-manual/html
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum ../site.sha256 | cut -d' ' -f1)" = "$DIGEST"
          test -f index.html
          test -z "$(find . ! -type f ! -type d -print -quit)"
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/manual.sha256"
          cmp ../site.sha256 "$RUNNER_TEMP/manual.sha256"
          jq -e --arg commit "$CANDIDATE" --arg version "$VERSION" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '
              .source_commit == $commit and .version == $version and .source_dirty == false and
              .run_id == $run and .run_attempt == $attempt
            ' build.json >/dev/null
          tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: pages_upload
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Require the final Pages upload ID
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact-id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      # Use the pinned Actions runtime artifact service (no repository API token).
      # Wait for this exact upload to be readable by ID and by the name deploy-pages uses.
      - name: Read back the exact Pages upload by ID
        id: pages_by_id
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.pages_upload.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/pages-id
      - name: Briefly wait for the same-run artifact by ID
        if: steps.pages_by_id.outcome == 'failure'
        run: sleep 5
      - name: Retry the exact same Pages upload by ID
        if: steps.pages_by_id.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.pages_upload.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/pages-id-retry
      - name: Read back the exact Pages deployment name
        id: pages_by_name
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-name
      - name: Briefly wait for the same-run Pages name
        if: steps.pages_by_name.outcome == 'failure'
        run: sleep 5
      - name: Retry the exact same Pages deployment name
        if: steps.pages_by_name.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-name-retry
      - name: Require both Pages artifact lookups to match the sealed bytes
        shell: bash
        env:
          ID_RESULT: ${{ steps.pages_by_id.outcome }}
          NAME_RESULT: ${{ steps.pages_by_name.outcome }}
        run: |
          set -euo pipefail
          id_path=pages-id
          name_path=pages-name
          if [ "$ID_RESULT" = failure ]; then id_path=pages-id-retry; fi
          if [ "$NAME_RESULT" = failure ]; then name_path=pages-name-retry; fi
          digest=$(sha256sum "$RUNNER_TEMP/artifact.tar" | cut -d' ' -f1)
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/$id_path/artifact.tar" \
            "$digest" "$RUNNER_TEMP/$name_path/artifact.tar" | sha256sum --check
      - name: Require current main inside deployment lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$current" =~ ^[0-9a-f]{40}$ ]]
          test "$current" = "$CANDIDATE"
      - name: Deploy verified manual
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
